{% load static office_tags %}<!doctype html>
<html lang="pt-BR" data-claw-theme>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1118">
  <title>Sem conexão · Nabio Office</title>
  <link rel="icon" href="{% static 'office/brand/icon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'office/claw-theme.css' %}">
  <link rel="stylesheet" href="{% static 'office/claw-utility.css' %}">
</head>
<body class="claw-utility-page">
  <header class="utility-header">
    <div class="utility-header-inner">
      <a class="utility-brand" href="/" aria-label="Nabio Office, início"><img src="{% static 'office/brand/icon.svg' %}" width="30" height="30" alt="">Nabio Office</a>
    </div>
  </header>
  <main class="utility-notice-layout">
    <section class="utility-panel utility-notice" aria-labelledby="offline-title">
      <span class="utility-icon" aria-hidden="true">{% icon 'bolt' 24 %}</span>
      <p class="utility-kicker">Conexão com o servidor</p>
      <h1 id="offline-title">O escritório está sem conexão.</h1>
      <p class="utility-description">Verifique sua conexão com a internet e tente novamente para acessar suas tarefas e salvar alterações.</p>
      <a class="utility-button utility-button--primary" href="/app/">Tentar novamente {% icon 'arrow' 17 %}</a>
    </section>
  </main>
</body>
</html>
